[theme]
primaryColor = "#1DB954"
backgroundColor = "#121212"
secondaryBackgroundColor = "#181818"
textColor = "#FFFFFF"
font = "sans serif"

[server]
maxUploadSize = 500
maxMessageSize = 500
enableWebsocketCompression = false
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
